<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSICOTRAP | ARTE HÍBRIDO</title>
    <style>
        :root {
            --cian: #00f2ff;
            --fucsia: #ff00ff;
            --dorado: #ffcc00;
            --negro: #000000;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Montserrat:wght@300&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--negro);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            cursor: default;
        }

        /* Marco de LED Dinámico */
        .frame {
            position: fixed;
            inset: 0;
            border: 5px solid transparent;
            background: linear-gradient(var(--negro), var(--negro)) padding-box,
                        conic-gradient(from var(--a), var(--cian), var(--fucsia), var(--dorado), var(--cian)) border-box;
            animation: rotate-frame 6s linear infinite;
            z-index: 100;
            pointer-events: none;
        }

        @property --a {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes rotate-frame {
            to { --a: 360deg; }
        }

        /* Contenedor Principal - Asegura visibilidad sobre el fondo */
        .container {
            position: relative;
            z-index: 50; /* Por encima de la niebla */
            text-align: center;
            padding: 20px;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            letter-spacing: 5px;
            color: var(--dorado);
            text-transform: uppercase;
            margin: 0;
        }

        h1 {
            font-size: clamp(2.5rem, 10vw, 6rem);
            font-weight: 900;
            letter-spacing: 10px;
            margin: 15px 0;
            background: linear-gradient(to bottom, #ffffff, var(--cian));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px var(--cian));
        }

        .phrase {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
            margin-bottom: 40px;
        }

        .coming-soon {
            font-size: 1.2rem;
            letter-spacing: 12px;
            color: var(--fucsia);
            text-shadow: 0 0 10px var(--fucsia);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        /* Canvas para partículas (Fuego/Niebla) */
        #fire-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Al fondo */
        }
    </style>
</head>
<body>

<div class="frame"></div>
<canvas id="fire-canvas"></canvas>

<div class="container">
    <h2>Arte Híbrido Experimental</h2>
    <h1>PSICOTRAP</h1>
    <div class="phrase">si llegaste acá es por algo...</div>
    <div class="coming-soon">PRÓXIMAMENTE</div>
</div>

<script>
    const canvas = document.getElementById('fire-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor() {
            this.init();
        }

        init() {
            this.x = Math.random() * canvas.width;
            this.y = canvas.height + Math.random() * 100;
            this.size = Math.random() * 3 + 1;
            this.speedY = Math.random() * -2 - 0.5; // Asciende
            this.speedX = Math.random() * 1 - 0.5;
            this.life = 1;
            this.decay = Math.random() * 0.008 + 0.003;
            
            const r = Math.random();
            if (r > 0.6) this.color = '#00f2ff'; // Cian
            else if (r > 0.3) this.color = '#ff00ff'; // Fucsia
            else this.color = '#ffcc00'; // Dorado
        }

        update() {
            this.y += this.speedY;
            this.x += this.speedX;
            this.life -= this.decay;
            if (this.life <= 0) this.init();
        }

        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Llenar array de partículas
    for (let i = 0; i < 100; i++) {
        particles.push(new Particle());
    }

    function animate() {
        // Fondo semi-transparente para crear rastro de "niebla"
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
            p.update();
            p.draw();
        });

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
