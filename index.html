<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicotrap J | Audio-Visual Universe</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Outfit:wght@100;300&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f2ff;
            --fuchsia: #ff00e0;
            --dark: #030303;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--dark);
            color: white; font-family: 'Outfit', sans-serif;
            overflow: hidden;
            cursor: default;
        }

        /* NIEBLA */
        #canvas-smoke {
            position: fixed; top: 0; left: 0; z-index: 1;
            filter: blur(60px) contrast(1.2); 
            opacity: 0.5;
            pointer-events: none;
        }

        #cursor-aura {
            position: fixed; top: 0; left: 0; width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.02) 0%, rgba(255, 0, 224, 0.02) 30%, transparent 60%);
            border-radius: 50%; pointer-events: none; z-index: 2;
            transform: translate(-50%, -50%); transition: background 0.3s ease;
            mix-blend-mode: screen;
        }

        /* TÍTULO */
        .main-title {
            position: absolute; top: 5%; left: 5%;
            font-family: 'Syncopate'; font-size: clamp(2rem, 4vw, 3.5rem);
            letter-spacing: 20px; color: rgba(255,255,255,0.8);
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            pointer-events: none; z-index: 10;
            margin: 0;
        }

        /* NAV FLOTANTE */
        .nav-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .nav-item {
            position: absolute;
            cursor: pointer; text-align: center;
            text-decoration: none; color: inherit;
            pointer-events: all;
        }

        .nav-item:nth-child(1) { top: 20%; left: 6%;  animation: floatA 5s   ease-in-out infinite alternate; }
        .nav-item:nth-child(2) { top: 22%; left: 28%; animation: floatB 6.5s ease-in-out infinite alternate; }
        .nav-item:nth-child(3) { top: 55%; left: 8%;  animation: floatC 7s   ease-in-out infinite alternate; }
        .nav-item:nth-child(4) { top: 58%; left: 26%; animation: floatD 5.5s ease-in-out infinite alternate; }

        @keyframes floatA { from { transform: translateY(0px) rotate(-1deg); }   to { transform: translateY(-14px) rotate(1deg); } }
        @keyframes floatB { from { transform: translateY(0px) rotate(1deg); }    to { transform: translateY(-18px) rotate(-1deg); } }
        @keyframes floatC { from { transform: translateY(0px) rotate(-0.5deg); } to { transform: translateY(-12px) rotate(1.5deg); } }
        @keyframes floatD { from { transform: translateY(0px) rotate(1deg); }    to { transform: translateY(-16px) rotate(-0.5deg); } }

        .nav-item:hover {
            filter: drop-shadow(0 0 18px var(--cyan));
            animation-play-state: paused;
        }

        .icon-abstract {
            width: 80px; height: 80px;
            fill: none; stroke: rgba(255,255,255,0.3); stroke-width: 1;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .nav-item:hover .icon-abstract {
            stroke: var(--cyan); stroke-width: 1.5;
            filter: drop-shadow(0 0 15px var(--cyan));
        }
        .neon-label {
            display: block; font-family: 'Syncopate'; font-size: 10px; margin-top: 15px;
            color: var(--cyan); opacity: 0; letter-spacing: 4px; transition: 0.4s;
        }
        .nav-item:hover .neon-label { opacity: 1; text-shadow: 0 0 10px var(--cyan); }

        /* REDES SOCIALES */
        .social-dock {
            position: fixed;
            bottom: 5%; left: 5%;
            display: flex; gap: 30px;
            z-index: 30;
        }
        .social-link {
            text-decoration: none; color: rgba(255,255,255,0.4);
            font-size: 12px; font-family: 'Syncopate';
            letter-spacing: 2px; transition: 0.3s;
            border-bottom: 1px solid transparent;
            padding-bottom: 5px;
        }
        .social-link:hover {
            color: var(--fuchsia);
            border-bottom: 1px solid var(--fuchsia);
            text-shadow: 0 0 10px var(--fuchsia);
        }

        /* =====================================================
           NOTA MUSICAL ÚNICA — esquina inferior derecha
           posición estratégica: antes del reproductor,
           sirve de "gatillo" visual para abrirlo
        ===================================================== */
        #note-trigger {
            position: fixed;
            right: 4%;
            bottom: 430px; /* justo encima del reproductor */
            z-index: 60;
            cursor: pointer;
            user-select: none;
            text-align: center;
        }

        .note-symbol {
            font-size: 90px;
            color: rgba(0, 242, 255, 0.25);
            display: block;
            animation: notePulse 3s ease-in-out infinite;
            transition: color 0.3s, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), text-shadow 0.3s;
            line-height: 1;
        }

        @keyframes notePulse {
            0%, 100% { opacity: 0.25; }
            50%       { opacity: 0.65; }
        }

        #note-trigger:hover .note-symbol {
            animation-play-state: paused;
            opacity: 1;
            color: var(--cyan);
            transform: translateX(-6px) scale(1.12);
            text-shadow: 0 0 25px var(--cyan), 0 0 60px var(--cyan);
        }

        #note-trigger.playing .note-symbol {
            animation: playingPulse 0.8s ease-in-out infinite alternate !important;
            color: white;
            transform: scale(1.2) translateX(-8px);
        }

        @keyframes playingPulse {
            from { text-shadow: 0 0 20px var(--fuchsia), 0 0 50px var(--fuchsia); opacity: 0.85; }
            to   { text-shadow: 0 0 60px var(--fuchsia), 0 0 120px var(--fuchsia), 0 0 180px rgba(255,0,224,0.3); opacity: 1; }
        }

        .note-hint {
            font-family: 'Syncopate';
            font-size: 8px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.15);
            display: block;
            margin-top: 6px;
            transition: color 0.3s, text-shadow 0.3s;
        }

        #note-trigger:hover .note-hint {
            color: rgba(0, 242, 255, 0.5);
            text-shadow: 0 0 8px var(--cyan);
        }

        /* =====================================================
           REPRODUCTOR EMBEBIDO — integrado al diseño
           Panel de cristal oscuro, bordes cyan sutiles
        ===================================================== */
        #player-panel {
            position: fixed;
            right: 4%;
            bottom: 3%;
            width: 260px;
            z-index: 55;

            /* Panel de cristal oscuro */
            background: rgba(3, 3, 3, 0.75);
            border: 1px solid rgba(0, 242, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
            box-shadow:
                0 0 30px rgba(0, 242, 255, 0.05),
                inset 0 0 20px rgba(0, 0, 0, 0.5);

            /* Aparece/desaparece */
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
        }

        #player-panel.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        /* Borde superior luminoso cuando suena */
        #player-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,242,255,0.4), rgba(255,0,224,0.4), transparent);
            z-index: 1;
        }

        /* Label NOW PLAYING sobre el iframe */
        #player-panel .player-label {
            font-family: 'Syncopate';
            font-size: 7px;
            letter-spacing: 5px;
            color: rgba(255,0,224,0.5);
            text-align: center;
            padding: 10px 0 6px;
            display: block;
            animation: labelBlink 1.5s ease-in-out infinite;
        }

        @keyframes labelBlink {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; text-shadow: 0 0 8px var(--fuchsia); }
        }

        #player-panel iframe {
            display: block;
            width: 100%;
            border: none;
            /* Tema oscuro nativo de Spotify Embed */
            filter: brightness(0.9) contrast(1.05);
        }

        /* =====================================================
           ELEMENTO CENTRAL (MANTENIDO)
        ===================================================== */
        #center-universe {
            position: fixed;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #waveCanvas { display: block; opacity: 0.6; }

        .center-identity { text-align: center; margin-top: -10px; }

        .center-identity .main-word {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: clamp(1.4rem, 2.5vw, 2.2rem);
            letter-spacing: 0.4em;
            color: transparent;
            background: linear-gradient(90deg, rgba(0,242,255,0.6) 0%, rgba(255,255,255,0.9) 50%, rgba(255,0,224,0.6) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
            animation: shimmer 4s linear infinite;
            background-size: 200% auto;
        }

        @keyframes shimmer {
            0%   { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .center-identity .sub-word {
            font-family: 'Outfit', sans-serif;
            font-weight: 100;
            font-size: clamp(0.55rem, 0.9vw, 0.75rem);
            letter-spacing: 0.55em;
            color: rgba(255,255,255,0.2);
            display: block;
            margin-top: 12px;
            text-transform: uppercase;
        }

        .center-line {
            width: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,242,255,0.5), rgba(255,0,224,0.5), transparent);
            margin: 14px auto;
            animation: expandLine 3s ease forwards 0.5s;
        }
        @keyframes expandLine { to { width: 180px; } }

        .ring-outer {
            position: absolute;
            width: 260px; height: 260px;
            border-radius: 50%;
            border: 1px solid rgba(0,242,255,0.08);
            animation: ringPulse 4s ease-in-out infinite;
            pointer-events: none;
        }
        .ring-outer:nth-child(2) {
            width: 320px; height: 320px;
            border-color: rgba(255,0,224,0.05);
            animation-delay: 1.5s;
        }
        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50%       { transform: scale(1.04); opacity: 1; }
        }

        .wave-wrapper {
            position: relative;
            display: flex; align-items: center; justify-content: center;
            width: 300px; height: 300px;
        }
        .ring-outer { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }

        .freq-label {
            font-family: 'Syncopate', sans-serif;
            font-size: 9px; letter-spacing: 4px;
            color: rgba(0,242,255,0.3);
            text-align: center; margin-top: 8px;
            animation: flickerText 5s ease-in-out infinite;
        }
        @keyframes flickerText {
            0%, 95%, 100% { opacity: 0.3; }
            97% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div id="cursor-aura"></div>
    <canvas id="canvas-smoke"></canvas>

    <h1 class="main-title">PSICOTRAP J</h1>

    <!-- NAV FLOTANTE -->
    <div class="nav-container">
        <a href="#origen" class="nav-item">a
            <svg class="icon-abstract" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" stroke-dasharray="2,4"/>
                <path d="M50 10 L50 90 M10 50 L90 50" stroke-width="0.5"/>
            </svg>
            <span class="neon-label">EL ORIGEN</span>
        </a>

        <a href="https://open.spotify.com/artist/4CcWDpVqx4cqBHTjzH1Fmj" target="_blank" class="nav-item">
            <svg class="icon-abstract" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40"/>
                <path d="M30 45 Q50 35 70 45 M30 55 Q50 45 70 55 M30 65 Q50 55 70 65" />

            <svg class="icon-abstract" viewBox="0 0 100 100">
                <rect x="25" y="25" width="50" height="50" stroke-dasharray="10,5"/>
                <path d="M25 75 L50 25 L75 75 Z" opacity="0.6"/>
            </svg>

        </a>

        <a href="https://www.youtube.com/@psicotrapj" target="_blank" class="nav-item">
            <svg class="icon-abstract" viewBox="0 0 100 100">
                <rect x="15" y="25" width="70" height="50" rx="10"/>
                <path d="M42 40 L62 50 L42 60 Z" fill="rgba(255,255,255,0.2)" stroke="none"/>
                <path d="M15 25 H85 V75 H15 Z" stroke-width="1"/>
            </svg>
            <span class="neon-label" style="color: var(--fuchsia);">YOUTUBE</span>
        </a>
    </div>

    <!-- ELEMENTO CENTRAL -->
    <div id="center-universe">
        <div class="wave-wrapper">
            <div class="ring-outer"></div>
            <div class="ring-outer"></div>
            <canvas id="waveCanvas" width="260" height="260"></canvas>
        </div>
        <div class="center-identity">
            <span class="main-word">PSICOTRAP J</span>
            <div class="center-line"></div>
            <span class="sub-word">audio · visual · universe</span>
        </div>
        <div class="freq-label">FREQ ▸ 440HZ ▸ 432HZ ▸ IDENTIDAD SONORA</div>
    </div>

    <!-- REDES SOCIALES -->
    <div class="social-dock">
        <a href="https://www.instagram.com/psicotrap_j" target="_blank" class="social-link">INSTAGRAM</a>
        <a href="https://www.tiktok.com/@psicotrapj_" target="_blank" class="social-link">TIKTOK</a>
    </div>

    <!-- NOTA MUSICAL ÚNICA — gatillo del reproductor -->
    <div id="note-trigger" onclick="togglePlayer()">
        <span class="note-symbol">♫</span>
        <span class="note-hint">ESCUCHAR</span>
    </div>

    <!-- REPRODUCTOR INTEGRADO AL DISEÑO -->
    <div id="player-panel">
        <span class="player-label">▶ NOW PLAYING</span>
        <iframe
            data-testid="embed-iframe"
            style="border-radius:12px"
            src="https://open.spotify.com/embed/artist/1WBvPa8B3lv2mzTYwkqRN8?utm_source=generator&theme=0"
            width="100%"
            height="352"
            frameBorder="0"
            allowfullscreen=""
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>
    </div>

    <script>
        // --- MOTOR DE NIEBLA (MANTENIDO INTACTO) ---
        const canvas = document.getElementById('canvas-smoke');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: -9999, y: -9999 };

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 300 + 150;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.opacity = Math.random() * 0.15 + 0.05;
            }
            update() {
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 350) {
                    const force = (350 - dist) / 350;
                    const angle = Math.atan2(dy, dx);
                    this.vx += Math.cos(angle) * force * 0.5;
                    this.vy += Math.sin(angle) * force * 0.5;
                }
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.98; this.vy *= 0.98;
                if (this.x < -this.radius) this.x = canvas.width + this.radius;
                if (this.x > canvas.width + this.radius) this.x = -this.radius;
                if (this.y < -this.radius) this.y = canvas.height + this.radius;
                if (this.y > canvas.height + this.radius) this.y = -this.radius;
            }
            draw() {
                const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                g.addColorStop(0, `rgba(120, 120, 120, ${this.opacity})`);
                g.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = g; ctx.fill();
            }
        }

        function initSmoke() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 50; i++) particles.push(new Particle());
        }

        function animateSmoke() {
            ctx.fillStyle = 'rgba(3, 3, 3, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateSmoke);
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX; mouse.y = e.clientY;
            const aura = document.getElementById('cursor-aura');
            aura.style.left = e.clientX + 'px';
            aura.style.top = e.clientY + 'px';
        });

        // --- TOGGLE REPRODUCTOR ---
        let playerOpen = false;

        function togglePlayer() {
            const panel = document.getElementById('player-panel');
            const trigger = document.getElementById('note-trigger');
            playerOpen = !playerOpen;
            if (playerOpen) {
                panel.classList.add('visible');
                trigger.classList.add('playing');
            } else {
                panel.classList.remove('visible');
                trigger.classList.remove('playing');
            }
        }

        // --- VISUALIZADOR DE ONDA CENTRAL ---
        const waveCanvas = document.getElementById('waveCanvas');
        const wctx = waveCanvas.getContext('2d');
        const W = waveCanvas.width;
        const H = waveCanvas.height;
        const cx = W / 2;
        const cy = H / 2;
        let waveTime = 0;

        const waveLayers = [
            { amp: 28, speed: 0.012, colorA: '0,242,255',   colorB: '255,0,224',   radius: 90,  phase: 0 },
            { amp: 18, speed: 0.018, colorA: '255,0,224',   colorB: '0,242,255',   radius: 70,  phase: Math.PI },
            { amp: 35, speed: 0.007, colorA: '100,200,255', colorB: '200,100,255', radius: 110, phase: Math.PI / 2 },
        ];

        function drawWaveCircle(layer, t) {
            const points = 200;
            wctx.beginPath();
            for (let i = 0; i <= points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const noise =
                    Math.sin(angle * 6 + t * layer.speed * 60 + layer.phase) * layer.amp * 0.5 +
                    Math.sin(angle * 3 - t * layer.speed * 40) * layer.amp * 0.3 +
                    Math.cos(angle * 9 + t * layer.speed * 80) * layer.amp * 0.2;
                const r = layer.radius + noise;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                if (i === 0) wctx.moveTo(x, y); else wctx.lineTo(x, y);
            }
            wctx.closePath();
            const grad = wctx.createLinearGradient(cx - layer.radius, cy, cx + layer.radius, cy);
            grad.addColorStop(0,   `rgba(${layer.colorA}, 0.7)`);
            grad.addColorStop(0.5, `rgba(${layer.colorB}, 0.5)`);
            grad.addColorStop(1,   `rgba(${layer.colorA}, 0.7)`);
            wctx.strokeStyle = grad;
            wctx.lineWidth = 1.2;
            wctx.stroke();
        }

        function animateWave() {
            wctx.clearRect(0, 0, W, H);
            const dotGrad = wctx.createRadialGradient(cx, cy, 0, cx, cy, 8);
            dotGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
            dotGrad.addColorStop(1, 'rgba(0,242,255,0)');
            wctx.beginPath();
            wctx.arc(cx, cy, 8, 0, Math.PI * 2);
            wctx.fillStyle = dotGrad;
            wctx.fill();
            waveLayers.forEach(layer => drawWaveCircle(layer, waveTime));
            waveTime++;
            requestAnimationFrame(animateWave);
        }

        initSmoke();
        animateSmoke();
        animateWave();
        window.addEventListener('resize', initSmoke);
    </script>
</body>
</html>
