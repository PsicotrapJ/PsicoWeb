<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicotrap J | Audio-Visual Universe</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Outfit:wght@100;300&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f2ff;
            --fuchsia: #ff00e0;
            --dark: #030303;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--dark);
            color: white; font-family: 'Outfit', sans-serif;
            overflow: hidden;
            cursor: crosshair;
        }

        /* --- MOTOR DE NIEBLA HIPERREALISTA (MANTENIDO) --- */
        #canvas-smoke {
            position: fixed; top: 0; left: 0; z-index: 1;
            filter: blur(60px) contrast(1.2); 
            opacity: 0.5;
            pointer-events: none;
        }

        #cursor-aura {
            position: fixed; top: 0; left: 0; width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.02) 0%, rgba(255, 0, 224, 0.02) 30%, transparent 60%);
            border-radius: 50%; pointer-events: none; z-index: 2;
            transform: translate(-50%, -50%); transition: background 0.3s ease;
            mix-blend-mode: screen;
        }

        .main-title {
            position: absolute; top: 5%; left: 5%;
            font-family: 'Syncopate'; font-size: clamp(2rem, 4vw, 3.5rem);
            letter-spacing: 20px; color: rgba(255,255,255,0.8);
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            pointer-events: none; z-index: 10;
            margin: 0;
        }

        /* --- NAVEGACIÓN --- */
        .nav-container {
            position: absolute;
            top: 50%; left: 10%;
            transform: translateY(-50%);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px 120px;
            z-index: 20;
        }

        .nav-item {
            position: relative; cursor: pointer; text-align: center;
            transition: transform 0.4s ease-out;
            text-decoration: none; color: inherit;
        }

        .nav-item:hover { transform: scale(1.05); }

        .icon-abstract {
            width: 80px; height: 80px;
            fill: none; stroke: rgba(255,255,255,0.3); stroke-width: 1;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .nav-item:hover .icon-abstract {
            stroke: var(--cyan); stroke-width: 1.5;
            filter: drop-shadow(0 0 15px var(--cyan));
        }

        .neon-label {
            display: block; font-family: 'Syncopate'; font-size: 10px; margin-top: 15px;
            color: var(--cyan); opacity: 0; letter-spacing: 4px; transition: 0.4s;
        }
        .nav-item:hover .neon-label { opacity: 1; text-shadow: 0 0 10px var(--cyan); }

        /* --- REDES SOCIALES (SOCIAL DOCK) --- */
        .social-dock {
            position: absolute; bottom: 5%; left: 5%;
            display: flex; gap: 30px; z-index: 30;
        }

        .social-link {
            text-decoration: none; color: rgba(255,255,255,0.4);
            font-size: 12px; font-family: 'Syncopate';
            letter-spacing: 2px; transition: 0.3s;
            border-bottom: 1px solid transparent;
            padding-bottom: 5px;
        }

        .social-link:hover {
            color: var(--fuchsia);
            border-bottom: 1px solid var(--fuchsia);
            text-shadow: 0 0 10px var(--fuchsia);
        }

        /* --- NOTAS MUSICALES (LADO DERECHO) --- */
        .notes-column {
            position: fixed; 
            right: 4%; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 50px; 
            z-index: 50;
        }

        .note-btn {
            font-size: 100px; cursor: pointer; color: rgba(255,255,255,0.1);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; user-select: none;
        }

        .note-btn:hover { color: var(--cyan); transform: translateX(-10px) scale(1.1); }

        .note-btn.playing {
            color: white; transform: scale(1.4) translateX(-20px);
            text-shadow: 0 0 40px var(--fuchsia), 0 0 80px var(--fuchsia);
            opacity: 1;
        }

        /* --- PENTAGRAMA --- */
        .staff-container {
            position: fixed; bottom: 50px; right: 4%;
            width: 400px; height: 60px; z-index: 100; 
            opacity: 0; pointer-events: none; transition: opacity 1s ease;
        }

        .staff-line {
            width: 100%; height: 1px; background: rgba(255,255,255,0.1);
            margin: 12px 0; position: relative;
        }

        #progress-dot {
            position: absolute; width: 12px; height: 12px;
            background: white; border-radius: 50%;
            top: 50%; left: 0; transform: translateY(-50%);
            box-shadow: 0 0 20px var(--fuchsia), 0 0 40px var(--cyan);
            transition: left 0.2s linear;
        }

        /* REPRODUCTOR - Ajustado para que funcione el audio pero no estorbe */
        #spotify-box { 
            position: fixed; bottom: 20px; left: 20px; 
            z-index: 1000; opacity: 0.05; transition: 0.5s;
            width: 300px; height: 80px; overflow: hidden;
            border-radius: 12px;
        }
        #spotify-box:hover { opacity: 1; } /* Se muestra un poco al pasar el mouse */

    </style>
</head>
<body>

    <div id="cursor-aura"></div>
    <canvas id="canvas-smoke"></canvas>

    <h1 class="main-title">PSICOTRAP J</h1>

    <div class="nav-container">
        <a href="#origen" class="nav-item">
            <svg class="icon-abstract" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" stroke-dasharray="2,4"/>
                <path d="M50 10 L50 90 M10 50 L90 50" stroke-width="0.5"/>
            </svg>
            <span class="neon-label">EL ORIGEN</span>
        </a>

        <a href="https://open.spotify.com/artist/tu_perfil" target="_blank" class="nav-item">
            <svg class="icon-abstract" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40"/>
                <path d="M30 45 Q50 35 70 45 M30 55 Q50 45 70 55 M30 65 Q50 55 70 65" />
            </svg>
            <span class="neon-label" style="color: var(--fuchsia);">SPOTIFY</span>
        </a>

        <a href="#lab" class="nav-item">
            <svg class="icon-abstract" viewBox="0 0 100 100">
                <rect x="25" y="25" width="50" height="50" stroke-dasharray="10,5"/>
                <path d="M25 75 L50 25 L75 75 Z" opacity="0.6"/>
            </svg>
            <span class="neon-label">INSIDE LAB</span>
        </a>

        <a href="https://www.youtube.com/@psicotrapj" target="_blank" class="nav-item">
            <svg class="icon-abstract" viewBox="0 0 100 100">
                <rect x="15" y="25" width="70" height="50" rx="10"/>
                <path d="M42 40 L62 50 L42 60 Z" fill="rgba(255,255,255,0.2)" stroke="none"/>
                <path d="M15 25 H85 V75 H15 Z" stroke-width="1"/>
            </svg>
            <span class="neon-label" style="color: var(--fuchsia);">YOUTUBE</span>
        </a>
    </div>

    <div class="social-dock">
        <a href="https://instagram.com/psicotrapj" target="_blank" class="social-link">INSTAGRAM</a>
        <a href="https://tiktok.com/@psicotrapj" target="_blank" class="social-link">TIKTOK</a>
        <a href="https://facebook.com/psicotrapj" target="_blank" class="social-link">FACEBOOK</a>
    </div>

    <div class="notes-column">
        <div class="note-btn" onclick="playTrack(this, '4LRPv9db0NH9p19YFW9YUC')">♩</div>
        <div class="note-btn" onclick="playTrack(this, '0VjCSh0uI5OaG4o7QzE7tB')">♪</div>
        <div class="note-btn" onclick="playTrack(this, '5o9C22IAsnJ5P3r7IuU8Hk')">♫</div>
    </div>

    <div class="staff-container" id="staff">
        <div class="staff-line"></div>
        <div class="staff-line"></div>
        <div class="staff-line" style="opacity: 0.5;"><div id="progress-dot"></div></div>
        <div class="staff-line"></div>
        <div class="staff-line"></div>
    </div>

    <div id="spotify-box">
        <iframe id="spotify-player" src="https://open.spotify.com/embed/track/4LRPv9db0NH9p19YFW9YUC" width="100%" height="80" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>

    <script>
        // --- MOTOR DE NIEBLA (MANTENIDO INTACTO) ---
        const canvas = document.getElementById('canvas-smoke');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: -9999, y: -9999 };

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 300 + 150; 
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.opacity = Math.random() * 0.15 + 0.05;
            }
            update() {
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if(dist < 350) {
                    const force = (350 - dist) / 350;
                    const angle = Math.atan2(dy, dx);
                    this.vx += Math.cos(angle) * force * 0.5;
                    this.vy += Math.sin(angle) * force * 0.5;
                }
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.98; this.vy *= 0.98;
                if (this.x < -this.radius) this.x = canvas.width + this.radius;
                if (this.x > canvas.width + this.radius) this.x = -this.radius;
                if (this.y < -this.radius) this.y = canvas.height + this.radius;
                if (this.y > canvas.height + this.radius) this.y = -this.radius;
            }
            draw() {
                const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                g.addColorStop(0, `rgba(120, 120, 120, ${this.opacity})`);
                g.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = g; ctx.fill();
            }
        }

        function initSmoke() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 50; i++) particles.push(new Particle());
        }

        function animateSmoke() {
            ctx.fillStyle = 'rgba(3, 3, 3, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateSmoke);
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX; mouse.y = e.clientY;
            const aura = document.getElementById('cursor-aura');
            aura.style.left = e.clientX + 'px';
            aura.style.top = e.clientY + 'px';
        });

        // --- LÓGICA DE REPRODUCCIÓN (CORREGIDA PARA AUDIO REAL) ---
        let progressInterval;

        function playTrack(btn, trackId) {
            document.querySelectorAll('.note-btn').forEach(n => n.classList.remove('playing'));
            clearInterval(progressInterval);
            btn.classList.add('playing');

            // URL CORREGIDA: Formato oficial de Spotify Embed
            const player = document.getElementById('spotify-player');
            player.src = `https://open.spotify.com/embed/track/${trackId}?utm_source=generator&autoplay=1`;

            const staff = document.getElementById('staff');
            const dot = document.getElementById('progress-dot');
            staff.style.opacity = '1';
            let pos = 0;
            progressInterval = setInterval(() => {
                pos += 0.1;
                dot.style.left = pos + "%";
                if(pos >= 100) {
                    clearInterval(progressInterval);
                    btn.classList.remove('playing');
                    staff.style.opacity = '0';
                }
            }, 200); 
        }

        initSmoke();
        animateSmoke();
        window.addEventListener('resize', initSmoke);
    </script>
</body>
</html>
