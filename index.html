<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSICOTRAP J - El Experimento Comienza</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Teko:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cyan: #00fff2;
            --magenta: #ff00ff;
            --yellow: #ffed00;
            --void: #000000;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: var(--void);
            color: #ffffff;
            overflow: hidden;
            cursor: default;
        }

        /* CANVAS LAYERS */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #refractionCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* GLITCH OVERLAY */
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 242, 0.03),
                rgba(0, 255, 242, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 2;
            animation: scanlines 8s linear infinite;
        }

        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(100px); }
        }

        /* MAIN CONTAINER */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* ATOMIC SYMBOLS */
        .atom {
            position: absolute;
            width: 150px;
            height: 150px;
            opacity: 0.4;
            animation: atomFloat 20s ease-in-out infinite;
        }

        .atom:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .atom:nth-child(2) {
            top: 15%;
            right: 15%;
            animation-delay: -5s;
        }

        .atom:nth-child(3) {
            bottom: 10%;
            left: 15%;
            animation-delay: -10s;
        }

        .atom:nth-child(4) {
            bottom: 15%;
            right: 10%;
            animation-delay: -15s;
        }

        @keyframes atomFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.3; }
            25% { transform: translate(20px, -20px) rotate(90deg); opacity: 0.6; }
            50% { transform: translate(-20px, 20px) rotate(180deg); opacity: 0.3; }
            75% { transform: translate(20px, 20px) rotate(270deg); opacity: 0.6; }
        }

        /* LOGO CONTAINER */
        .logo-container {
            position: relative;
            margin-bottom: 60px;
            animation: logoEntrance 2s ease-out;
        }

        @keyframes logoEntrance {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
                filter: blur(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        .subtitle {
            font-family: 'Teko', sans-serif;
            font-size: 22px;
            font-weight: 300;
            color: var(--cyan);
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 1.5s ease-out 0.5s forwards;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 120px;
            font-weight: 900;
            text-align: center;
            line-height: 0.9;
            margin-bottom: 20px;
            position: relative;
            opacity: 0;
            animation: fadeInUp 1.5s ease-out 0.8s forwards;
        }

        .main-title .psico {
            background: linear-gradient(135deg, var(--cyan) 0%, var(--magenta) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            animation: titlePulse 4s ease-in-out infinite;
        }

        .main-title .trap {
            background: linear-gradient(135deg, var(--magenta) 0%, var(--yellow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            animation: titlePulse 4s ease-in-out infinite;
            animation-delay: 0.5s;
        }

        @keyframes titlePulse {
            0%, 100% {
                text-shadow: 0 0 20px rgba(0, 255, 242, 0.5);
                transform: scale(1);
            }
            50% {
                text-shadow: 0 0 40px rgba(255, 0, 255, 0.8), 0 0 80px rgba(255, 0, 255, 0.4);
                transform: scale(1.02);
            }
        }

        .tagline {
            font-family: 'Teko', sans-serif;
            font-size: 28px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            font-style: italic;
            margin-bottom: 60px;
            opacity: 0;
            animation: fadeInUp 1.5s ease-out 1.1s forwards;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* WAVEFORM */
        .waveform-container {
            width: 600px;
            height: 80px;
            margin-bottom: 40px;
            position: relative;
            opacity: 0;
            animation: fadeInUp 1.5s ease-out 1.4s forwards;
        }

        /* SPOTIFY PLAYER */
        .spotify-container {
            width: 600px;
            max-width: 90%;
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeInUp 1.5s ease-out 1.6s forwards;
            position: relative;
        }

        .spotify-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, var(--cyan), var(--magenta), var(--yellow));
            border-radius: 14px;
            z-index: -1;
            opacity: 0.5;
            filter: blur(8px);
        }

        .spotify-container iframe {
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 255, 242, 0.3);
        }

        .waveform {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .wave-bar {
            width: 6px;
            background: linear-gradient(to top, var(--cyan), var(--magenta));
            border-radius: 3px;
            animation: waveAnimation 1.5s ease-in-out infinite;
            box-shadow: 0 0 10px var(--cyan);
        }

        .wave-bar:nth-child(1) { height: 30%; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 50%; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 70%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 90%; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 100%; animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { height: 90%; animation-delay: 0.5s; }
        .wave-bar:nth-child(7) { height: 70%; animation-delay: 0.6s; }
        .wave-bar:nth-child(8) { height: 50%; animation-delay: 0.7s; }
        .wave-bar:nth-child(9) { height: 30%; animation-delay: 0.8s; }
        .wave-bar:nth-child(10) { height: 50%; animation-delay: 0.9s; }
        .wave-bar:nth-child(11) { height: 70%; animation-delay: 1s; }
        .wave-bar:nth-child(12) { height: 90%; animation-delay: 1.1s; }
        .wave-bar:nth-child(13) { height: 100%; animation-delay: 1.2s; }
        .wave-bar:nth-child(14) { height: 90%; animation-delay: 1.3s; }
        .wave-bar:nth-child(15) { height: 70%; animation-delay: 1.4s; }

        @keyframes waveAnimation {
            0%, 100% { transform: scaleY(0.5); opacity: 0.6; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        /* COMING SOON */
        .coming-soon {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--yellow);
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 1.5s ease-out 1.7s forwards, pulseGlow 2s ease-in-out 2.2s infinite;
            text-shadow: 0 0 20px var(--yellow);
        }

        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 20px var(--yellow); }
            50% { text-shadow: 0 0 40px var(--yellow), 0 0 60px var(--yellow); }
        }

        /* CTA BUTTONS */
        .cta-container {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeInUp 1.5s ease-out 2s forwards;
        }

        .cta-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            padding: 18px 40px;
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            transition: left 0.5s ease;
        }

        .cta-btn:hover::before {
            left: 100%;
        }

        .cta-btn:hover {
            box-shadow: 0 0 30px var(--cyan), inset 0 0 30px rgba(0, 255, 242, 0.2);
            transform: translateY(-3px);
        }

        .cta-btn.secondary {
            border-color: var(--magenta);
            color: var(--magenta);
        }

        .cta-btn.secondary::before {
            background: linear-gradient(90deg, transparent, var(--magenta), transparent);
        }

        .cta-btn.secondary:hover {
            box-shadow: 0 0 30px var(--magenta), inset 0 0 30px rgba(255, 0, 255, 0.2);
        }

        /* SOCIAL LINKS */
        .social-links {
            display: flex;
            gap: 30px;
            opacity: 0;
            animation: fadeInUp 1.5s ease-out 2.3s forwards;
        }

        .social-link {
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
        }

        .social-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--cyan);
            transition: width 0.3s ease;
        }

        .social-link:hover {
            color: var(--cyan);
            text-shadow: 0 0 10px var(--cyan);
        }

        .social-link:hover::after {
            width: 100%;
        }

        /* GLITCH EFFECT */
        .glitch {
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .glitch::before {
            animation: glitch-1 2.5s infinite;
            color: var(--cyan);
            z-index: -1;
        }

        .glitch::after {
            animation: glitch-2 2.5s infinite;
            color: var(--magenta);
            z-index: -2;
        }

        @keyframes glitch-1 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }

        @keyframes glitch-2 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(2px, -2px); }
            40% { transform: translate(2px, 2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(-2px, 2px); }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .main-title {
                font-size: 60px;
            }
            
            .subtitle {
                font-size: 16px;
                letter-spacing: 4px;
            }
            
            .tagline {
                font-size: 20px;
            }
            
            .waveform-container {
                width: 90%;
            }

            .spotify-container {
                width: 95%;
            }
            
            .coming-soon {
                font-size: 24px;
            }
            
            .cta-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .cta-btn {
                width: 100%;
                text-align: center;
            }
            
            .social-links {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .atom {
                width: 80px;
                height: 80px;
            }
        }

        /* LOADING ANIMATION */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--void);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeOut 1s ease-out 2s forwards;
        }

        .loading-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            color: var(--cyan);
            letter-spacing: 4px;
            animation: loadingPulse 1.5s ease-in-out infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                pointer-events: none;
            }
        }
    </style>
</head>

        <ellipse cx="50" cy="50" rx="38" ry="18" fill="none" stroke="var(--yellow)" stroke-width="1" opacity="0.5">
            <animateTransform attributeName="transform" type="rotate" from="30 50 50" to="390 50 50" dur="14s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="50" cy="50" rx="18" ry="38" fill="none" stroke="var(--cyan)" stroke-width="1" opacity="0.5">
            <animateTransform attributeName="transform" type="rotate" from="30 50 50" to="-330 50 50" dur="9s" repeatCount="indefinite"/>
        </ellipse>
    </svg>

    <!-- MAIN CONTENT -->
    <div class="container">
        <div class="logo-container">
            <div class="subtitle">ARTE HÍBRIDO EXPERIMENTAL</div>
            <h1 class="main-title glitch" data-text="PSICOTRAP J">
                <span class="psico">PSICO</span><span class="trap">TRAP</span> <span style="color: #fff; font-size: 0.5em; font-weight: 400;">J</span>
            </h1>

        <div class="waveform-container">
            <div class="waveform">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>
        </div>

        <!-- SPOTIFY PLAYER -->
        <div class="spotify-container">
            <iframe 
                data-testid="embed-iframe" 
                style="border-radius:12px" 
                src="https://open.spotify.com/embed/artist/1WBvPa8B3lv2mzTYwkqRN8?utm_source=generator"

            <a href="https://open.spotify.com/intl-es/artist/1WBvPa8B3lv2mzTYwkqRN8?si=FFykLXAHSsuWlsOUoWxqwQ" target="_blank" class="social-link">Spotify</a>

    <script>
        // ============================================
        // SMOKE/PARTICLE SYSTEM
        // ============================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const smokeParticles = [];
        const particleCount = 80;
        const colors = ['#00fff2', '#ff00ff', '#ffed00'];

        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        class SmokeParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = -Math.random() * 0.8 - 0.5;
                this.radius = Math.random() * 40 + 20;
                this.opacity = Math.random() * 0.3 + 0.1;
                this.colorIndex = Math.floor(Math.random() * colors.length);
                this.color = colors[this.colorIndex];
                this.life = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.003;

                // Mouse interaction - empuje suave
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 150) {
                    const angle = Math.atan2(dy, dx);
                    const force = (150 - distance) / 150;
                    this.vx -= Math.cos(angle) * force * 0.5;
                    this.vy -= Math.sin(angle) * force * 0.5;
                    
                    // Cambio de color al interactuar
                    this.colorIndex = (this.colorIndex + 1) % colors.length;
                    this.color = colors[this.colorIndex];
                }

                // Límites de velocidad
                this.vx *= 0.98;
                this.vy *= 0.98;

                // Reset si sale de pantalla o muere
                if (this.y < -100 || this.life <= 0 || this.x < -100 || this.x > canvas.width + 100) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity * this.life;
                
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = gradient;
                ctx.filter = 'blur(15px)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        // Initialize smoke particles
        for (let i = 0; i < particleCount; i++) {
            smokeParticles.push(new SmokeParticle());
        }

        // ============================================
        // REFRACTION EFFECT (PSICODÉLICO)
        // ============================================
        const refractionCanvas = document.getElementById('refractionCanvas');
        const refractionCtx = refractionCanvas.getContext('2d');

        refractionCanvas.width = window.innerWidth;
        refractionCanvas.height = window.innerHeight;

        const waves = [];
        const waveCount = 5;

        class RefractionWave {
            constructor() {
                this.x = Math.random() * refractionCanvas.width;
                this.y = Math.random() * refractionCanvas.height;
                this.radius = 0;
                this.maxRadius = Math.random() * 200 + 100;
                this.speed = Math.random() * 0.5 + 0.3;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = Math.random() * 0.15 + 0.05;
            }

            update() {
                this.radius += this.speed;
                
                if (this.radius > this.maxRadius) {
                    this.x = Math.random() * refractionCanvas.width;
                    this.y = Math.random() * refractionCanvas.height;
                    this.radius = 0;
                    this.maxRadius = Math.random() * 200 + 100;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }
            }

            draw() {
                refractionCtx.save();
                refractionCtx.globalAlpha = this.opacity * (1 - this.radius / this.maxRadius);
                refractionCtx.strokeStyle = this.color;
                refractionCtx.lineWidth = 2;
                refractionCtx.filter = 'blur(3px)';
                refractionCtx.beginPath();
                refractionCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                refractionCtx.stroke();
                refractionCtx.restore();
            }
        }

        // Initialize refraction waves
        for (let i = 0; i < waveCount; i++) {
            waves.push(new RefractionWave());
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================
        function animate() {
            // Clear smoke canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update and draw smoke
            smokeParticles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            // Clear refraction canvas
            refractionCtx.clearRect(0, 0, refractionCanvas.width, refractionCanvas.height);

            // Update and draw refraction waves
            waves.forEach(wave => {
                wave.update();
                wave.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // ============================================
        // MOUSE TRACKING
        // ============================================
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // ============================================
        // RESIZE HANDLER
        // ============================================
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            refractionCanvas.width = window.innerWidth;
            refractionCanvas.height = window.innerHeight;
        });

        // ============================================
        // NOTIFICATION FUNCTION
        // ============================================
        function notifyMe(e) {
            e.preventDefault();
            
            const email = prompt('Ingresa tu email para recibir notificaciones del lanzamiento:');
            
            if (email && email.includes('@')) {
                alert('¡Perfecto! Te notificaremos cuando el experimento comience.\n\nMientras tanto, sígueme en las redes para no perderte nada.');
            } else if (email) {
                alert('Email inválido. Inténtalo de nuevo.');
            }
        }

        // ============================================
        // GLITCH EFFECT ON HOVER
        // ============================================
        const glitchElement = document.querySelector('.glitch');
        
        glitchElement.addEventListener('mouseenter', () => {
            glitchElement.style.animation = 'none';
            setTimeout(() => {
                glitchElement.style.animation = '';
            }, 10);
        });

        // ============================================
        // RANDOM GLITCH TRIGGER
        // ============================================
        setInterval(() => {
            const overlay = document.querySelector('.glitch-overlay');
            overlay.style.opacity = Math.random() > 0.95 ? '0.3' : '1';
            setTimeout(() => {
                overlay.style.opacity = '1';
            }, 100);
        }, 3000);
    </script>
</body>
</html>
